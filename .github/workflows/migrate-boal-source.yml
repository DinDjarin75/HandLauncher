      - name: Preserve old ZIP snapshots away from repository root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/source-snapshots
          shopt -s nullglob
          for f in BOALLauncher-source-*.zip; do
            mv "$f" "legacy/source-snapshots/$f"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore stable BOAL signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: boal-debug-keystore-v1

      - name: Ensure stable BOAL signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep "SHA256:"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build public V1 APK from exposed source
        run: gradle --no-daemon :app:assembleRelease

      - name: Stage APK and release checksum
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk BOAL-Launcher-1.0.0.apk
          sha256sum BOAL-Launcher-1.0.0.apk > BOAL-Launcher-1.0.0.apk.sha256
          cp BOAL-Launcher-1.0.0.apk.sha256 RELEASE_CHECKSUMS.sha256

      - name: Generate source manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f SOURCE_MANIFEST.sha256
          find . -type f \
            -not -path './.git/*' \
            -not -path './legacy/*' \
            -not -path './app/build/*' \
            -not -name 'BOAL-Launcher-1.0.0.apk' \
            -not -name 'BOAL-Launcher-1.0.0.apk.sha256' \
            -not -name 'SOURCE_MANIFEST.sha256' \
            -not -path './.github/workflows/migrate-boal-source.yml' \
            -print0 | sort -z | xargs -0 sha256sum > SOURCE_MANIFEST.sha256

      - name: Remove one-time migration workflow from final tree
        run: rm -f .github/workflows/migrate-boal-source.yml

      - name: Commit clean browsable repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- BOAL-Launcher-1.0.0.apk BOAL-Launcher-1.0.0.apk.sha256 app/build || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Expose BOAL 1.0.0 source and harden public release"
            git push origin HEAD:main
          fi

      - name: Attach APK and checksum to existing V1.0.0 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload V1.0.0 \
            BOAL-Launcher-1.0.0.apk \
            BOAL-Launcher-1.0.0.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOAL-Launcher-1.0.0-clean-repo-build
          path: |
            BOAL-Launcher-1.0.0.apk
            BOAL-Launcher-1.0.0.apk.sha256
          if-no-files-found: error
