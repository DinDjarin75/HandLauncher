name: One-time BOAL repository migration

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/migrate-boal-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify exact V1 source archive exists
        run: |
          test -f BOALLauncher-source-1.0.0.zip
          echo "Using exact public V1 source archive: BOALLauncher-source-1.0.0.zip"

      - name: Expose V1 Android source as normal repository files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .migration-src
          mkdir .migration-src
          unzip -q BOALLauncher-source-1.0.0.zip -d .migration-src
          test -f .migration-src/HandLauncher/settings.gradle.kts

          # Copy the exact shipped V1 project into the repository root.
          # .github is replaced separately by the cleaned CI workflow below.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='legacy/' \
            --exclude='BOALLauncher-source-*.zip' \
            .migration-src/HandLauncher/ ./

          rm -rf .migration-src

      - name: Install cleaned documentation and CI layer
