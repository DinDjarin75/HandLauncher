name: Build Hand Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unpack Hand source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q HandLauncher-source.zip -d buildsrc
          test -f buildsrc/HandLauncher/settings.gradle.kts

      - name: Unit tests
        working-directory: buildsrc/HandLauncher
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: buildsrc/HandLauncher
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hand-launcher-debug-apk
          path: buildsrc/HandLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
