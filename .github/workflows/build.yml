name: Build BOAL Launcher 1.0.0 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore stable BOAL signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: boal-debug-keystore-v1

      - name: Ensure stable BOAL signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep "SHA256:"

      - name: Unpack BOAL Launcher 1.0.0 source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q BOALLauncher-source-1.0.0.zip -d buildsrc
          test -f buildsrc/HandLauncher/settings.gradle.kts

      - name: Run unit tests
        working-directory: buildsrc/HandLauncher
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build public release APK
        working-directory: buildsrc/HandLauncher
        run: gradle --no-daemon :app:assembleRelease

      - name: Stage clean public APK
        run: |
          test -f buildsrc/HandLauncher/app/build/outputs/apk/release/app-release.apk
          cp buildsrc/HandLauncher/app/build/outputs/apk/release/app-release.apk BOAL-Launcher-1.0.0.apk

      - name: Upload BOAL Launcher 1.0.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: BOAL-Launcher-1.0.0
          path: BOAL-Launcher-1.0.0.apk
          if-no-files-found: error
