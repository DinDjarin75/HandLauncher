name: Build Hand Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unpack Hand Launcher source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q HandLauncher-source-alpha06.1.zip -d buildsrc
          test -f buildsrc/HandLauncher/settings.gradle.kts

      - name: Run unit tests
        working-directory: buildsrc/HandLauncher
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: buildsrc/HandLauncher
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload Hand Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: hand-launcher-debug-apk
          path: buildsrc/HandLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
