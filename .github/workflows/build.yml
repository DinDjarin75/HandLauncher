name: Build Hand Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unpack and align Hand Launcher source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q HandLauncher-source.zip -d buildsrc

          test -f buildsrc/HandLauncher/settings.gradle.kts

          python3 - <<'PY'
          from pathlib import Path

          path = Path("buildsrc/HandLauncher/app/build.gradle.kts")
          text = path.read_text()

          replacements = {
              "compileSdk = 37": "compileSdk = 36",
              "targetSdk = 37": "targetSdk = 36",
              "androidx.compose:compose-bom:2026.09.00":
                  "androidx.compose:compose-bom:2025.08.00",
              "androidx.core:core-ktx:1.17.0":
                  "androidx.core:core-ktx:1.16.0",
              "androidx.activity:activity-compose:1.13.0":
                  "androidx.activity:activity-compose:1.10.1",
              "androidx.lifecycle:lifecycle-runtime-compose:2.11.0":
                  "androidx.lifecycle:lifecycle-runtime-compose:2.9.4",
              "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0":
                  "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4",
              "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0":
                  "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(
                      f"Expected dependency/config entry not found: {old}"
                  )
              text = text.replace(old, new)

          text = text.replace(
              '    implementation("androidx.compose.material3.adaptive:adaptive:1.3.0")\n',
              ''
          )

          path.write_text(text)
          PY

      - name: Run unit tests
        working-directory: buildsrc/HandLauncher
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: buildsrc/HandLauncher
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload Hand Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: hand-launcher-debug-apk
          path: buildsrc/HandLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
